id: AWS-002
title: AWS IAM permission or trust-policy change
platform: aws
service: AWS CloudTrail
status: implemented
severity: high
description: Detects selected IAM API operations commonly associated with changing identity permissions, group membership, managed policy versions or role trust.
data_sources:
  - AWS CloudTrail delivered to CloudWatch Logs
mitre_attack:
  - technique_id: T1098
    name: Account Manipulation
query_file: query.logs-insights
test_scenario:
  - Use an authorised AWS lab.
  - Perform one controlled low-risk IAM policy attachment or trust-policy update.
  - Confirm the expected CloudTrail event is delivered.
  - Run the query and verify actor, event and target details.
false_positives:
  - Approved IAM administration through change management.
  - Infrastructure-as-code deployments that intentionally update IAM.
  - Automated identity-governance workflows.
triage:
  - Identify the caller ARN and source IP.
  - Review the target identity or policy.
  - Compare the change with approved IaC or a change ticket.
  - Check whether the change increases privilege or creates a new trust path.
response:
  - Reverse unauthorised IAM changes through approved procedures.
  - Secure the initiating identity if compromise is suspected.
  - Review subsequent AssumeRole and privileged API activity.
limitations:
  - The operation list is intentionally selective and must evolve with the environment.
  - A matching IAM change is not inherently malicious.
