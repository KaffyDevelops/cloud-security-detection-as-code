name: Detection Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  detection-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject sensitive tracked files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.pem$|.*\.key$|.*\.p12$|.*\.pfx$)'; then
            echo "Sensitive file type detected."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate detection catalogue
        run: python tools/validate_detections.py
